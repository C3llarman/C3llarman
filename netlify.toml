[build]
  command = "mkdir -p public/data && cp -r data/. public/data/"
  publish = "public"

# One real URL path per party (public/index.html reads location.pathname
# to pick which roster to fetch) - kept as rewrites (status 200, not a
# redirect) so the address bar still shows /ninth-circle etc. Add a line
# here for every id in data/parties.json.
[[redirects]]
  from = "/ninth-circle"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/emberwatch"
  to = "/index.html"
  status = 200
